<style>
/* ============================================================
   XR-Code — single-file UI  |  Made by Yug and Saksham  |  v1.0.0
   ============================================================ */
:root{
  --font-head:'Cinzel', Georgia, serif;
  --font-body:'Inter', system-ui, -apple-system, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --radius:14px;
}
/* ---------- DARK THEME (black marble + clouds) ---------- */
:root[data-theme="dark"]{
  --bg:#000000;
  --bg-marble:
    radial-gradient(1100px 480px at 50% -12%, rgba(216,219,228,.07), transparent 62%),
    radial-gradient(700px 340px at 88% 112%, rgba(255,255,255,.05), transparent 60%),
    radial-gradient(560px 300px at 6% 104%, rgba(216,219,228,.035), transparent 60%),
    #000000;
  --bg2:#0b0b0e;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.07);
  --text:#f4f5f7;
  --muted:#8e9099;
  --accent:#dfe3ea;
  --accent-2:#a7adb9;
  --accent-ink:#0e1013;
  --line:rgba(255,255,255,.10);
  --line-soft:rgba(255,255,255,.06);
  --col-a:rgba(255,255,255,.055);
  --col-b:rgba(255,255,255,.012);
  --col-line:rgba(255,255,255,.10);
  --danger:#ff7a7a;
  --ok:#8fdca8;
  --shadow:0 18px 50px rgba(0,0,0,.5);
}
/* ---------- LIGHT THEME (lavender marble + greek columns) ---------- */
:root[data-theme="light"]{
  --bg:#f7f7f8;
  --bg-marble:
    radial-gradient(1000px 460px at 50% -14%, rgba(255,255,255,.95), transparent 60%),
    radial-gradient(760px 380px at 90% 112%, rgba(0,0,0,.045), transparent 60%),
    linear-gradient(180deg,#ffffff 0%, #f2f2f4 100%);
  --bg2:#ffffff;
  --panel:rgba(255,255,255,.82);
  --panel-2:rgba(255,255,255,.97);
  --text:#0b0b0d;
  --muted:#6d7076;
  --accent:#101216;
  --accent-2:#3f434b;
  --accent-ink:#ffffff;
  --line:rgba(0,0,0,.13);
  --line-soft:rgba(0,0,0,.07);
  --col-a:rgba(0,0,0,.10);
  --col-b:rgba(0,0,0,.02);
  --col-line:rgba(0,0,0,.18);
  --danger:#d64550;
  --ok:#1d9e5b;
  --shadow:0 18px 44px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--bg-marble);
  background-attachment:fixed;
  color:var(--text);
  display:flex;flex-direction:column;
  min-height:100vh;
  transition:background .35s ease,color .35s ease;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- hero scene backdrops (ionic columns) ---------- */
.scene{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center bottom;
  pointer-events:none;z-index:0;user-select:none;
}
.scene.light-only{display:none}
:root[data-theme="light"] .scene.dark-only{display:none}
:root[data-theme="light"] .scene.light-only{display:block}
.hero > *:not(.scene){z-index:1}

/* ---------- logo images + quick theme toggle ---------- */

.logo .logo-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:9px}.logo-img.light-only,.bs-logo.light-only{display:none!important}:root[data-theme="light"] .logo-img.light-only,:root[data-theme="light"] .bs-logo.light-only{display:block!important}:root[data-theme="light"] .logo-img.dark-only,:root[data-theme="light"] .bs-logo.dark-only{display:none!important}
.theme-quick{
  width:36px;height:36px;border:1px solid var(--line);border-radius:10px;
  display:grid;place-items:center;color:var(--muted);background:var(--panel);
  transition:color .15s,border-color .15s;flex:none;
}
.theme-quick:hover{color:var(--accent);border-color:var(--accent)}
.theme-quick .ic-moon{display:none}
:root[data-theme="light"] .theme-quick .ic-moon{display:block}
:root[data-theme="light"] .theme-quick .ic-sun{display:none}
/* ---------- theme switch animation (radial wipe + cross-fade fallback) ---------- */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
html.theme-fade,html.theme-fade body,html.theme-fade *,html.theme-fade *::before,html.theme-fade *::after{transition:background .55s ease,background-color .55s ease,color .55s ease,border-color .55s ease,box-shadow .55s ease,fill .55s ease,stroke .55s ease !important}
.theme-quick .ic{transition:transform .5s cubic-bezier(.45,0,.2,1)}
.theme-quick:active .ic{transform:rotate(-120deg) scale(.82)}

/* ---------- scrollbars ---------- */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   TOP BAR  —  logo | XR-Code | logo
   ============================================================ */
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:12px;padding:10px 20px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand.right{justify-content:flex-end}
.brand .made{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.brand .made b{color:var(--text)}
.logo{width:36px;height:36px;flex:none;display:grid;place-items:center;line-height:0}
.title-center{text-align:center;min-width:0}
.title-center h1{
  font-family:var(--font-head);font-weight:700;font-size:21px;
  letter-spacing:.42em;text-indent:.42em;color:var(--text);
  cursor:pointer;user-select:none;white-space:nowrap;
}
.title-center .tag{
  display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);margin-top:2px;white-space:nowrap;
}
.version-badge{
  font-family:var(--font-mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;
}
.version-badge b{color:var(--accent);font-weight:600}

/* ============================================================
   SHELL : main + right sidebar
   ============================================================ */
.shell{flex:1;display:flex;min-height:0}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.active{display:flex}

/* ============================================================
   HOME
   ============================================================ */
#view-home{position:relative;overflow:hidden}
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:48px 110px 28px;position:relative;text-align:center;
}
/* decorative greek columns on both sides */
.column{
  position:absolute;top:26px;bottom:26px;width:58px;pointer-events:none;border-radius:8px;
  border:1px solid var(--col-line);
  background:
    linear-gradient(180deg, var(--col-line), transparent 7%, transparent 93%, var(--col-line)),
    repeating-linear-gradient(90deg, var(--col-a) 0 5px, var(--col-b) 5px 13px);
}
.column::before,.column::after{
  content:"";position:absolute;left:-7px;right:-7px;height:13px;border-radius:5px;
  border:1px solid var(--col-line);background:var(--col-a);
}
.column::before{top:-16px}
.column::after{bottom:-16px}
.column.l{left:26px}
.column.r{right:26px}
.clouds{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(560px 190px at 28% 2%, rgba(255,255,255,.06), transparent 70%),
    radial-gradient(480px 170px at 74% 8%, rgba(185,167,255,.07), transparent 70%);
}
:root[data-theme="light"] .clouds{opacity:.6}

.hero-pill{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:7px 16px;background:var(--panel);
}
.hero-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hero h2{
  font-family:var(--font-head);font-size:clamp(34px,4.6vw,54px);font-weight:700;
  letter-spacing:.10em;line-height:1.05;
}
.hero h2 .thin{background:linear-gradient(160deg,#ffffff 8%,#c9ccd5 46%,#8f939e 82%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--muted);font-size:14px;letter-spacing:.05em;margin-top:-12px}

/* big search bar */
@property --gs{syntax:'<angle>';inherits:false;initial-value:0deg}
.big-search{
  position:relative;
  width:min(660px,100%);display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:8px 8px 8px 20px;box-shadow:var(--shadow);
  backdrop-filter:blur(12px);transition:border-color .2s;
}
.big-search:focus-within{border-color:transparent;box-shadow:var(--shadow),0 0 26px -6px var(--accent-2)}
.big-search::before{                                   /* light sweep running around the border */
  content:"";position:absolute;inset:-1.5px;border-radius:17.5px;padding:1.5px;
  background:conic-gradient(from var(--gs),
    transparent 0turn 0.72turn,
    var(--accent) 0.86turn,
    #ffffff 0.93turn,
    var(--accent) 0.97turn,
    transparent 1turn);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .25s;
  animation:gs-spin 2.4s linear infinite;
  pointer-events:none;
}
.big-search:focus-within::before{opacity:1}
@keyframes gs-spin{to{--gs:360deg}}
.big-search .bs-logo{height:30px;width:auto;border-radius:8px;object-fit:contain;display:block;flex:none}
.big-search input{
  flex:1;min-width:0;background:none;border:none;outline:none;
  font-size:15.5px;padding:12px 4px;color:var(--text);
}
.big-search input::placeholder{color:var(--muted)}
.send-btn{
  display:grid;place-items:center;width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  transition:transform .15s ease, filter .15s;
}
.file-btn{
  display:grid;place-items:center;width:44px;height:44px;border-radius:12px;flex:none;
  background:var(--panel-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);
  transition:color .15s,box-shadow .15s;
}
.file-btn:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.attach-row{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 0}
.attach-row:empty{display:none}
.att-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.att-chip .nm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-chip .sz{color:var(--muted);font-size:10.5px;white-space:nowrap}
.att-chip .rm{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;color:var(--muted);flex:none;font-size:13px;line-height:1}
.att-chip .rm:hover{color:var(--danger);background:var(--panel)}
.att-chip img{width:26px;height:26px;object-fit:cover;border-radius:6px;flex:none}
.msg .att-line{display:flex;flex-wrap:wrap;gap:6px}
.composer.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.send-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}

.hero .ver{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.12em}
.hero .ver b{color:var(--accent);font-weight:600}

/* ============================================================
   RIGHT SIDEBAR
   ============================================================ */
.sidebar{
  width:302px;flex:none;display:flex;flex-direction:column;min-height:0;order:-1;
  border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);
}
.side-head{padding:14px 16px 8px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;position:relative}
.nav-glider{position:absolute;left:10px;right:10px;top:0;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);pointer-events:none;z-index:0;opacity:1;will-change:transform}
.nav-glider.off{opacity:0}
.nav-glider.no-anim{transition:none !important}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 11px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--text);
  position:relative;z-index:1;
  transition:background .15s,color .2s;
}
.nav button:hover{background:var(--panel-2)}
.nav button.current{color:var(--accent)}
.nav .ic{flex:none}
.chat-search{padding:10px 12px 4px;display:none}
.chat-search.open{display:block}
.chat-search input{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:12.5px;outline:none;color:var(--text);
}
.chat-search input:focus{border-color:var(--accent)}
.search-list{flex:1;overflow-y:auto;min-height:60px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sr-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;transition:background .15s}
.sr-item:hover{background:var(--panel-2)}
.sr-item .st{display:block;font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-item .sx{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;font-family:var(--font-mono)}
.sr-empty{padding:14px;font-size:12px;color:var(--muted);text-align:center}
.msg.hit .bubble{box-shadow:0 0 0 1.5px var(--accent)}
.dots{display:inline-flex;gap:5px;padding:7px 2px 3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dotB 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotB{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.stream-cursor{display:inline-block;width:8px;height:14px;margin-left:2px;vertical-align:-2px;background:var(--accent);animation:curB .8s steps(1) infinite}
@keyframes curB{50%{opacity:0}}
.resizer{width:6px;flex:none;order:-1;cursor:col-resize;background:transparent;transition:background .15s}
.resizer:hover,.resizer.drag{background:var(--accent)}
/* login box */
.login-box{border-top:1px solid var(--line);padding:14px 16px 16px;background:var(--panel-2)}
.login-box h3{
  font-family:var(--font-head);font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.login-box h3::after{content:"";flex:1;height:1px;background:var(--line)}
.login-stack{display:flex;flex-direction:column;gap:8px}
.auth-btn{
  display:flex;align-items:center;gap:10px;width:100%;justify-content:flex-start;
  border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:500;
  background:var(--panel);transition:border-color .15s, transform .15s;
}
.auth-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.auth-btn .sub{margin-left:auto;font-size:10.5px;color:var(--muted)}
/* api key form */
.api-form{display:none;flex-direction:column;gap:8px;margin-top:4px}
.api-form.open{display:flex}
.api-form label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.api-form input{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;font-size:12px;outline:none;font-family:var(--font-mono);
}
.api-form input:focus{border-color:var(--accent)}
.api-connect{
  border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
}
.sync-line{
  display:flex;align-items:flex-start;gap:8px;margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line);font-size:11px;color:var(--muted);line-height:1.5;
}
.sync-line .ic{flex:none;margin-top:1px;color:var(--accent)}
.sync-line b{color:var(--text)}

/* ============================================================
   CHAT VIEW
   ============================================================ */
.chat-head{
  display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);
}
.chat-head .cht{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{
  font-family:var(--font-mono);font-size:10.5px;color:var(--accent);white-space:nowrap;
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);
}
.msgs{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{max-width:76%;display:flex;flex-direction:column;gap:6px}
.msg .who{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.msg .bubble{
  border-radius:14px;padding:12px 15px;font-size:14px;line-height:1.6;white-space:pre-wrap;
  word-wrap:break-word;
}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.u .bubble{background:linear-gradient(135deg,#f0f2f6,#b6bbc6);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start}
.msg.a .bubble{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .chip{align-self:flex-start}
.retry-line{display:flex;justify-content:flex-start}
.retry-btn{
  display:inline-flex;align-items:center;gap:6px;margin-top:2px;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--text);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--panel-2);
  transition:border-color .18s,color .18s,box-shadow .18s;
}
.retry-btn:hover{border-color:var(--accent-2);color:var(--accent);box-shadow:var(--shadow)}
.retry-btn .ic{width:13px;height:13px}
.msg pre{
  font-family:var(--font-mono);font-size:12px;line-height:1.6;overflow-x:auto;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
}
.code-wrap{display:flex;flex-direction:column;min-width:0}
.code-bar{
  display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;
  background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;
  font-family:var(--font-mono);font-size:10.5px;color:var(--muted);
}
.code-wrap pre{border-radius:0 0 12px 12px}
.code-fold{
  display:inline-flex;align-items:center;justify-content:center;margin-left:auto;
  width:26px;height:22px;border-radius:7px;color:var(--muted);
  transition:color .15s,background .15s;
}
.code-fold:hover{color:var(--accent);background:var(--panel)}
.code-fold svg{transform:rotate(90deg)}
.code-wrap.folded .code-fold svg{transform:rotate(0deg)}
.code-body{display:grid;grid-template-rows:1fr;overflow:hidden}
.code-body>pre{min-height:0}
.code-wrap.folded .code-body{grid-template-rows:0fr}
.code-wrap.folded .code-body>pre{padding-top:0;padding-bottom:0;border-top-width:0;border-bottom-width:0}
.code-wrap.folded .code-bar{border-bottom:1px solid var(--line);border-radius:12px}
@media (prefers-reduced-motion:no-preference){
  .code-body{transition:grid-template-rows .32s ease}
  .code-fold svg{transition:transform .28s cubic-bezier(.3,1.25,.35,1)}
}
.empty-state{
  margin:auto;text-align:center;color:var(--muted);font-size:13.5px;max-width:380px;line-height:1.7;
}
.empty-state .big{
  font-family:var(--font-head);font-size:22px;color:var(--text);letter-spacing:.14em;
  display:block;margin-bottom:8px;
}
.composer{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 24px 18px;border-top:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(12px);
}
.composer input{
  flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;font-size:14px;outline:none;min-width:0;
}
.composer input:focus{border-color:var(--accent)}
/* ============================================================
   AI ENGINE (lives in Settings now)
   ============================================================ */
.panel{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;
}
.panel h3{
  font-family:var(--font-head);font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;
}
.panel h3 .ic{color:var(--accent)}
.panel p.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:-6px}
/* switch rows */
.switch-row{display:flex;align-items:center;gap:11px;font-size:13px;padding:4px 0}
.switch-row .lbl{flex:1;line-height:1.4}
.switch-row .lbl small{display:block;font-size:11px;color:var(--muted)}
.switch{position:relative;width:38px;height:21px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .tr{
  position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s;cursor:pointer;
}
.switch .tr::before{
  content:"";position:absolute;width:15px;height:15px;border-radius:50%;left:3px;top:3px;
  background:#fff;transition:.2s;
}
.switch input:checked + .tr{background:var(--accent)}
.switch input:checked + .tr::before{transform:translateX(17px)}
.tagm{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:2.5px 8px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.tagm.heavy{color:var(--accent-2);border-color:var(--accent-2)}
.tagm.budget{color:var(--ok);border-color:var(--ok)}
.token-stat{
  display:flex;align-items:baseline;gap:10px;border:1px dashed var(--accent-2);
  border-radius:11px;padding:12px 14px;background:var(--bg2);
}
.token-stat .num{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--accent)}
.token-stat .cap{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* ============================================================
   SETTINGS
   ============================================================ */
.settings-wrap{flex:1;overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:18px;align-items:center}
.settings-col{width:min(640px,100%);display:flex;flex-direction:column;gap:18px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.seg button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px;font-size:13px;font-weight:500;color:var(--muted);
}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.acc-row{
  display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;background:var(--bg2);
}
.acc-row .ai2{flex:1;min-width:0}
.acc-row .an{font-size:13.5px;font-weight:600}
.acc-row .as{font-size:11.5px;color:var(--muted)}
.mini-btn{
  border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:12px;color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;
}
.mini-btn:hover{color:var(--text);border-color:var(--accent)}
.mini-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.data-row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:11px;color:var(--muted);line-height:1.6;border-left:2px solid var(--accent-2);padding-left:12px}

/* toasts */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{
  background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:10px 14px;font-size:12.5px;box-shadow:var(--shadow);
  animation:tin .25s ease;max-width:320px;
}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.big{width:19px;height:19px}
.ic.small{width:13.5px;height:13.5px}

/* ---------- login steps + main AI providers ---------- */
.step-lbl{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
.auth-btn .req{margin-left:auto;font-size:9px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--accent-2);color:var(--accent-2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.prov-head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:3px 1px}
.prov-head .pn{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.prov-tag{font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);border:1px solid var(--accent-2);border-radius:999px;padding:1.5px 7px}
.prov-tag.free{color:var(--ok);border-color:var(--ok)}
.prov-btn{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:5px 11px;color:var(--muted);white-space:nowrap;transition:border-color .15s,color .15s}
.prov-btn:hover{color:var(--text);border-color:var(--accent)}
.prov-btn.ok{color:var(--ok);border-color:var(--ok)}
.login-box.pulse{animation:loginPulse .9s ease 2}
@keyframes loginPulse{50%{box-shadow:0 0 0 3px var(--col-line)}}

/* ---------- light theme: strict white & black ---------- */
:root[data-theme="light"] .hero h2 .thin{background:linear-gradient(160deg,#1a1c20 8%,#3c4046 46%,#85898f 82%);-webkit-background-clip:text;background-clip:text}
:root[data-theme="light"] .msg.u .bubble{background:linear-gradient(135deg,#3a3d43,#101216);color:#ffffff}
:root[data-theme="light"] .scene.light-only{filter:grayscale(1) contrast(1.07) brightness(1.03)}
:root[data-theme="light"] .clouds{filter:grayscale(1);opacity:.4}

/* responsive */
/* ---------- startup — select a model ---------- */
.startup-back{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:22px}
.startup-back.open{display:flex}
.startup{width:min(430px,94vw);max-height:88vh;overflow:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px 22px;text-align:center;animation:stIn .25s ease}
@keyframes stIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.st-brand{font-family:var(--font-head);letter-spacing:.34em;font-size:13px;color:var(--muted);margin-bottom:14px}
.startup h2{font-family:var(--font-head);font-size:22px;letter-spacing:.06em;margin:0 0 8px}
.st-sub{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0 0 20px}
.st-card{width:100%;display:flex;align-items:center;gap:12px;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--font-body);transition:border-color .15s,transform .15s}
.st-card:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.st-name{font-size:16px;font-weight:700;color:var(--text);flex:1;text-align:left}
.st-name em{display:block;font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.st-tag{padding:3px 9px;border-radius:99px;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
.st-go{font-size:13px;font-weight:700;color:var(--accent-2)}
.st-open{display:block;width:100%;box-sizing:border-box;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;margin-bottom:12px}
.st-open:hover{border-color:var(--accent-2)}
.st-open b{display:block;font-size:13.5px;margin-bottom:3px}
.st-open span{font-size:11.5px;color:var(--muted);line-height:1.55}
.st-input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:500 13px var(--font-mono);margin-bottom:12px}
.st-input:focus{outline:1px solid var(--accent-2)}
.st-go-btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:700 13.5px var(--font-body);cursor:pointer}
.st-go-btn:hover{filter:brightness(1.08)}
.st-skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:500 11.5px var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.st-skip:hover{color:var(--text)}
@media (max-width:980px){
  .shell{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-top:1px solid var(--line);max-height:46vh;order:2}
  .resizer{display:none}
  .hero{padding:40px 26px}
  .column{display:none}
  .topbar{grid-template-columns:auto 1fr auto}
  .title-center h1{font-size:16px;letter-spacing:.28em}
  .brand .made{display:none}
  .version-badge{display:none}
}
  /* inline styles moved out of HTML */
  .data-row{margin-top:12px}
  .note{margin-top:12px}

  /* ================= UI polish pass (GPU-friendly) ================= */
  body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  html{scroll-behavior:smooth}
  .big-search input{caret-color:var(--accent)}
  .big-search{transition:border-color .2s,transform .2s,box-shadow .2s}
  .big-search:hover{transform:translateY(-1px)}
  .st-card:hover{box-shadow:var(--shadow)}
  .nav button .ic{transition:transform .2s cubic-bezier(.3,.7,.3,1)}
  .nav button:hover .ic{transform:translateX(2px)}
  .send-btn:active,.theme-quick:active{transform:scale(.94)}
  /* search send button: > flips to < on click */
  .send-btn .ic{transition:transform .28s cubic-bezier(.3,.7,.3,1)}
  .send-btn.flip .ic{transform:rotate(180deg)}
  .hero h2 .thin,:root[data-theme="light"] .hero h2 .thin{background-size:200% auto}
  @media (prefers-reduced-motion: no-preference){
    @keyframes xr-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes xr-view{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes xr-scene{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
    @keyframes xr-sheen{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .view.active{animation:xr-view .32s cubic-bezier(.3,.7,.3,1)}
    .nav-glider{transition:transform .42s cubic-bezier(.3,1.25,.35,1),opacity .22s ease}
    .nav button.current .ic{animation:xr-tabpop .5s cubic-bezier(.3,.7,.3,1)}
    .nav button:active{transform:scale(.97)}
    @keyframes xr-tabpop{0%{transform:scale(.55) rotate(-12deg)}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1) rotate(0deg)}}
    @keyframes xr-view-fwd{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
    @keyframes xr-view-bck{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
    .view.slide-fwd{animation:xr-view-fwd .36s cubic-bezier(.3,.7,.3,1)}
    .view.slide-bck{animation:xr-view-bck .36s cubic-bezier(.3,.7,.3,1)}
    .att-chip{animation:xr-chipin .28s cubic-bezier(.3,.7,.3,1) backwards}
    @keyframes xr-chipin{from{opacity:0;transform:translateY(6px) scale(.92)}to{opacity:1;transform:none}}
    .scene{animation:xr-scene .9s cubic-bezier(.25,.7,.3,1) both}
    .hero > *:not(.scene){animation:xr-rise .55s cubic-bezier(.2,.7,.2,1) backwards}
    .hero > *:not(.scene):nth-child(3){animation-delay:.06s}
    .hero > *:not(.scene):nth-child(4){animation-delay:.12s}
    .hero > *:not(.scene):nth-child(5){animation-delay:.18s}
    .hero > *:not(.scene):nth-child(6){animation-delay:.24s}
    .hero > *:not(.scene):nth-child(7){animation-delay:.3s}
    .hero h2 .thin,:root[data-theme="light"] .hero h2 .thin{animation:xr-sheen 7s linear infinite}
  }
</style>
</head>
<body>

<!-- ============ SVG ICON LIBRARY ============ -->
<!-- icon sprite + images hydrate from JS -->

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="brand left">
    <div class="logo"><img class="logo-img dark-only" data-asset="logo-dark" alt="XR-Code logo"><img class="logo-img light-only" data-asset="logo-light" alt="XR-Code logo"></div>
    <span class="made"><b>XR-Code</b></span>
  </div>
  <div class="title-center">
    <h1 id="brandTitle" title="Home">XR-Code</h1>
    <span class="tag">Code Smarter. Build Faster.</span>
  </div>
  <div class="brand right">
    <span class="version-badge">Version <b>1.0.0</b></span>
    <button class="theme-quick" id="themeQuick" type="button" title="Toggle light / dark mode">
      <i class="ic ic-sun" data-ic="i-sun"></i>
      <i class="ic ic-moon" data-ic="i-moon"></i>
    </button>
  </div>
</header>

<div class="shell">
  <!-- ============ MAIN ============ -->
  <main>
    <!-- ===== HOME ===== -->
    <section id="view-home" class="view active">
      <div class="hero">
<img class="scene dark-only" data-asset="scene-dark" alt="">
        <img class="scene light-only" data-asset="scene-light" alt="">

        <span class="hero-pill"><span class="dot"></span> Hosted by Z.ai</span>
        <h2>XR <span class="thin">CODE</span></h2>
        <p class="sub">What would you like to do with XR-Code?</p>

        <form class="big-search" id="homeForm">
          <img class="bs-logo dark-only" data-asset="wordmark" alt="XR logo" draggable="false"><img class="bs-logo light-only" data-asset="tile-light" alt="XR logo" draggable="false">
          <button class="file-btn" id="homeFileBtn" type="button" title="Attach files"><i class="ic" data-ic="i-clip"></i></button>
          <input id="homeInput" autocomplete="off" placeholder="What would you like to do with XR-Code?">
          <button class="send-btn" type="submit" title="Send"><i class="ic" data-ic="i-chev"></i></button>
        </form>

      </div>
    </section>

    <!-- ===== CHAT ===== -->
    <section id="view-chat" class="view">
      <div class="chat-head">
        <span class="cht" id="chatTitle">New Project</span>
        <span class="chip" id="chatModelChip">online</span>
      </div>
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="chatForm">
        <button class="file-btn" id="fileBtn" type="button" title="Attach files"><i class="ic" data-ic="i-clip"></i></button>
        <input id="chatInput" autocomplete="off" placeholder="Message XR Code...">
        <button class="send-btn" type="submit" title="Send"><i class="ic" data-ic="i-send"></i></button>
      </form>
    </section>

        <!-- ===== SETTINGS ===== -->
    <section id="view-settings" class="view">
      <div class="settings-wrap">
        <div class="settings-col">
          <div class="panel">
            <h3><i class="ic big" data-ic="i-sun"></i> Theme</h3>
            <div class="seg" id="themeSeg">
              <button type="button" data-th="light" id="thLight"><i class="ic small" data-ic="i-sun"></i> Light</button>
              <button type="button" data-th="dark" id="thDark"><i class="ic small" data-ic="i-moon"></i> Dark</button>
            </div>
          </div>

          <div class="panel">
            <h3><i class="ic big" data-ic="i-cloud"></i> Chats &amp; Account</h3>
            <div id="accBox"></div>
            <div class="data-row">
              <button class="mini-btn" id="exportBtn" type="button"><i class="ic small" data-ic="i-down"></i> Export chats (JSON)</button>
              <button class="mini-btn danger" id="clearBtn" type="button"><i class="ic small" data-ic="i-trash"></i> Clear all data</button>
            </div>
            <p class="note">Chats are stored in this browser. The AI brain is hosted on the XR-Code server — it just works for everyone.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ RIGHT SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="side-head">Workspace</div>
    <nav class="nav">
      <button id="btnHome" class="current" type="button"><i class="ic" data-ic="i-home"></i> Home</button>
      <button id="btnSearch" type="button"><i class="ic" data-ic="i-search"></i> Search</button>
      <button id="btnProject" type="button"><i class="ic" data-ic="i-plus"></i> Make a project</button>
      <button id="btnSettings" type="button"><i class="ic" data-ic="i-gear"></i> Settings</button>
      <!-- No Library tab, as requested -->
    </nav>

    <div class="chat-search" id="chatSearchWrap">
      <input id="chatSearch" autocomplete="off" placeholder="Search old code & chats...">
    </div>
    <div class="search-list" id="searchResults"></div>

  </aside>

  <div class="resizer" id="resizer" title="Drag to resize the sidebar"></div>
</div>

<div class="toasts" id="toasts"></div>

const $  = s => document.querySelector(s);

/* ---------- state ---------- */
const LSKEY = 'xrcode.v1';
function defaults(){
  return {

let S = load() || defaults();
(function migrate(){

function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){} updateSyncUI(); renderStatus(); }

/* ---------- toasts ---------- */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

/* ---------- views ---------- */
const VIEWS = ['home', 'chat', 'settings'];
var curView = 'home';
function showView(name){
  const order = {home:0, chat:1, settings:2};
  const prevName = curView;
  VIEWS.forEach(v => $('#view-' + v).classList.toggle('active', v === name));
  const sec = $('#view-' + name);
  if(name !== prevName){
    sec.classList.remove('slide-fwd', 'slide-bck');
    void sec.offsetWidth;
    sec.classList.add(order[name] >= order[prevName] ? 'slide-fwd' : 'slide-bck');
  }
  curView = name;
  syncTabs();
  if(name === 'chat') renderChat();
}
function syncTabs(){                              // one source of truth for the selected tab
  const wrap = $('#chatSearchWrap');
  const searchOn = !!(wrap && wrap.classList.contains('open'));
  let target;
  if(searchOn) target = $('#btnSearch');
  else if(curView === 'settings') target = $('#btnSettings');
  else if(curView === 'chat') target = $('#btnProject');
  else target = $('#btnHome');
  $$('#btnHome,#btnSearch,#btnProject,#btnSettings').forEach(b => b.classList.toggle('current', b === target));
  if(window.__glide) window.__glide(target);
}
/* ---------- sidebar tab glider (pill that slides between tabs) ---------- */
(function(){
  const nav = document.querySelector('.nav');
  if(!nav) return;
  const g = document.createElement('div');
  g.className = 'nav-glider no-anim off';
  g.setAttribute('aria-hidden', 'true');
  nav.appendChild(g);
  let shown = false;
  window.__glide = function(btn){
    if(!btn) return;
    const r = btn.getBoundingClientRect(), n = nav.getBoundingClientRect();
    g.style.height = r.height + 'px';
    g.style.transform = 'translateY(' + Math.round(r.top - n.top) + 'px)';
    if(!shown){                                   // first placement: jump, no slide
      shown = true;
      requestAnimationFrame(() => requestAnimationFrame(() => g.classList.remove('no-anim')));
    }
    g.classList.remove('off');
  };
  const snap = fn => {                            // reposition instantly (no slide-in on resize/fonts)
    g.classList.add('no-anim');
    fn();
    requestAnimationFrame(() => requestAnimationFrame(() => g.classList.remove('no-anim')));
  };
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => snap(syncTabs), 100); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => snap(syncTabs));
  snap(syncTabs);                                 // place the pill on the boot tab
})();

/* ---------- theme ---------- */
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  $$('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.th === S.theme));
}
function setTheme(th){
  if(th === S.theme) return;                     // same theme -> nothing to animate
  const rootEl = document.documentElement;
  S.theme = th; save();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(document.startViewTransition && !reduce){  // directional radial wipe
    let x, y;                                    // -> light: top right (button) | -> dark: bottom left
    if(th === 'light'){
      x = innerWidth; y = 0;
      const btn = document.getElementById('themeQuick');
      if(btn){ const r = btn.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    }else{
      x = 0; y = innerHeight;
    }
    const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 40;
    const vt = document.startViewTransition(applyTheme);
    vt.ready.then(() => {
      rootEl.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + R + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 650, easing: 'cubic-bezier(.45,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(() => {});
  }else{                                         // fallback: smooth whole-page color cross-fade
    rootEl.classList.add('theme-fade');
    applyTheme();
    setTimeout(() => rootEl.classList.remove('theme-fade'), 680);
  }
  toast(th === 'dark' ? 'Dark mode on' : 'Light mode on');
}

/* ---------- time labels ---------- */
function ago(ts){
  const m = (now() - ts) / 6e4;
  if(m < 1) return 'now';
  if(m < 60) return Math.floor(m) + 'm';
  const h = m / 60;
  if(h < 24) return Math.floor(h) + 'h';
  return Math.floor(h / 24) + 'd';
}
function agoFull(ts){
  const a = ago(ts);
  return a === 'now' ? 'just now' : a + ' ago';
}
/* ---------- chat view ---------- */
function currentChat(){
  let c = S.chats.find(x => x.id === S.active);
  if(!c){
    c = { id: uid(), title: 'New Project', ts: now(), messages: [] };
    S.chats.push(c); S.active = c.id;
  }
  return c;
}
/* ---------- AI code replies: fence split + foldable code blocks ---------- */
function codeExt(code){
  const c = (code || '').slice(0, 500);
  if(/^\s*<!doctype html/i.test(c) || /<html[\s>]/i.test(c)) return 'html';
  if(/^\s*<svg[\s>]/i.test(c)) return 'svg';
  if(/^\s*\{[\s\S]*\}\s*$/.test(code || '') && /"[^"]+"\s*:/.test(c)) return 'json';
  if(/<\?php/.test(c)) return 'php';
  if(/#include|int\s+main\s*\(/.test(c)) return 'c';
  if(/^\s*(def |class \w+|import \w+|from \w+ import)/m.test(c) && /:\s*$/m.test(c)) return 'py';
  if(/^#!\/bin\/(ba)?sh/m.test(c) || /^\s*curl\s/m.test(c)) return 'sh';
  if(/\bSELECT\b[\s\S]{0,400}\bFROM\b/i.test(c)) return 'sql';
  if(/^\s*---$/m.test(c) && /^\s*[\w-]+:/m.test(c)) return 'yml';
  if(/=>|\bfunction\b|\bconst\b|\blet\b|console\.\w+\(|document\.\w+\(|require\(/.test(c)) return 'js';
  if(/<\/?[a-z][\w-]*[\s>]/i.test(c)) return 'html';
  return 'txt';
}
function splitFence(t){                           // ALL '```py\ncode```' -> ordered parts
  const parts = [];
  const re = /```[\w+-]*\r?\n([\s\S]*?)```/g;
  let last = 0, m;
  while((m = re.exec(t))){
    const before = t.slice(last, m.index).trim();
    if(before) parts.push({ t: before });
    parts.push({ code: m[1].replace(/\s+$/, '') });
    last = m.index + m[0].length;
  }
  const tail = t.slice(last).trim();
  if(tail || !parts.length) parts.push({ t: tail || t });
  const firstText = parts.find(p => p.t !== undefined) || {};
  const firstCode = parts.find(p => p.code !== undefined);
  return { parts, text: firstText.t !== undefined ? firstText.t : '', code: firstCode ? firstCode.code : undefined };
}
function codeBlock(code){
  const ext = codeExt(code);
  const wrap = document.createElement('div'); wrap.className = 'code-wrap';
  const bar = document.createElement('div'); bar.className = 'code-bar';
  const name = document.createElement('span'); name.className = 'code-name'; name.textContent = 'xr-code.' + ext;
  const fold = document.createElement('button'); fold.className = 'code-fold'; fold.type = 'button'; fold.title = 'Fold / unfold this code';
  fold.innerHTML = '<svg class="ic small"><use href="#i-chev"/></svg>';
  fold.onclick = () => wrap.classList.toggle('folded');
  bar.append(name, fold);
  const body = document.createElement('div'); body.className = 'code-body';
  const pre = document.createElement('pre'); pre.textContent = code;
  body.append(pre);
  wrap.append(bar, body);
  return wrap;
}
function renderChat(){
  const c = currentChat();
  $('#chatTitle').textContent = c.title;
  const inp = $('#chatInput');
  inp.disabled = false;
  inp.placeholder = 'Message XR Code...';
  const box = $('#msgs'); box.innerHTML = '';
  if(!c.messages.length){
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.innerHTML = '<span class="big">XR Code</span>Ask anything or drop a photo or video — the AI brain plans, codes, debugs, explains and sees.';
    box.append(e); return;
  }
  c.messages.forEach(m => box.append(msgEl(m, c)));
  box.scrollTop = box.scrollHeight;
}
function msgEl(m, c){
  const w = document.createElement('div'); w.className = 'msg ' + (m.r === 'u' ? 'u' : 'a');
  const who = document.createElement('span'); who.className = 'who';
  who.textContent = m.r === 'u' ? 'You' : 'XR Code';
  w.append(who);
  if(m.att && m.att.length){
    const line = document.createElement('div'); line.className = 'att-line';
    m.att.forEach(a => {
      const chip = document.createElement('span'); chip.className = 'att-chip';
      if(a.d && (a.ty || '').indexOf('image/') === 0){
        const im = document.createElement('img'); im.src = a.d; im.alt = a.n; chip.append(im);
      }else{
        const ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        ic.setAttribute('class', 'ic small'); ic.innerHTML = '<use href="#i-file"/>';
        chip.append(ic);
      }
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = a.n; nm.title = a.n;
      chip.append(nm);
      if(window.fmtSz){ const sz = document.createElement('span'); sz.className = 'sz'; sz.textContent = window.fmtSz(a.sz); chip.append(sz); }
      line.append(chip);
    });
    w.append(line);
  }
  if(m.parts && m.parts.length){
    m.parts.forEach(p => {
      if(p.code !== undefined) w.append(codeBlock(p.code));
      else { const nb = document.createElement('div'); nb.className = 'bubble'; nb.textContent = p.t; w.append(nb); }
    });
  } else {
    const b = document.createElement('div'); b.className = 'bubble'; b.textContent = m.t;
    w.append(b);
    if(m.code){ w.append(codeBlock(m.code)); }
  }
  return w;
}

/* ---------- sending ---------- */
function sendMsg(text){
  text = (text || '').trim();
  const live = window.__takeAtts ? window.__takeAtts() : [];
  if(!text && !live.length) return;                // nothing to send — but a bare photo is fine
  const c = currentChat();
  const base = text || (live[0] ? live[0].n : 'Photo');
  if(c.title === 'New Project') c.title = base.slice(0, 34) + (base.length > 34 ? '...' : '');
  const atts = live.map(a => {                     // persist light metadata only (storage quota)
    const o = { n: a.n, sz: a.sz, ty: a.ty };
    if(a.d && a.d.length < 110000) o.d = a.d;      // small image previews survive reload
    return o;
  });
  c.messages.push({ r: 'u', t: text, att: atts });
  c.ts = now();
  showView('chat');
  renderChat(); save();

  askBrain(c, text, live);
}
function typeReply(c, reply, pen){
  const box = $('#msgs');
  if(pen && pen.parentNode) pen.remove();       // clear the thinking-dots bubble
  const el = document.createElement('div'); el.className = 'msg a';
  const who = document.createElement('span'); who.className = 'who'; who.textContent = 'XR Code';
  const body = document.createElement('div'); body.className = 'bubble';
  el.append(who, body);
  if(currentChat().id === c.id) box.append(el);  // only show when this chat is on screen
  box.scrollTop = box.scrollHeight;

  const cur = document.createElement('span'); cur.className = 'stream-cursor';
  let i = 0;
  const iv = setInterval(() => {
    if(!document.contains(el)){           // user switched chats while typing
      clearInterval(iv);
      c.messages.push({ r: 'a', t: reply.text, code: reply.code, parts: reply.parts, m: 'live' });
      save(); return;
    }
    i += (reply.text.length > 900 ? 2 : 1);   // slow, human-like typing
    body.textContent = reply.text.slice(0, i);
    body.append(cur);
    box.scrollTop = box.scrollHeight;
    if(i >= reply.text.length){
      clearInterval(iv);
      cur.remove();
      body.textContent = reply.text;
      (reply.parts || []).forEach((p, ix) => {
        if(ix === 0 && p.t !== undefined) return;      // first text part is the typed bubble
        if(p.code !== undefined){ el.append(codeBlock(p.code)); }
        else { const nb = document.createElement('div'); nb.className = 'bubble'; nb.textContent = p.t; el.append(nb); }
      });
      c.messages.push({ r: 'a', t: reply.text, code: reply.code, parts: reply.parts, m: 'live' });
      c.ts = now();
      save();
    }
  }, 16);
}

/* ---------- hosted brain ---------- */
function brainContext(c){
  return c.messages.slice(-20).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
}
async function askBrain(c, text, atts){
  const chip = $('#chatModelChip');
  chip.textContent = 'thinking…';
  const box0 = $('#msgs');                               // animated thinking bubble (like modern AI chats)
  const pen = document.createElement('div'); pen.className = 'msg a';
  const who0 = document.createElement('span'); who0.className = 'who'; who0.textContent = 'XR Code';
  const body0 = document.createElement('div'); body0.className = 'bubble';
  const dots = document.createElement('span'); dots.className = 'dots';
  dots.innerHTML = '<i></i><i></i><i></i>';
  body0.append(dots);
  pen.append(who0, body0);
  if(currentChat().id === c.id) box0.append(pen);
  box0.scrollTop = box0.scrollHeight;
  let last = text;                               // feed file contents to the hosted brain
  (atts || []).forEach(a => {
    if(a.txt) last += '\n\n[attached file: ' + a.n + ']\n' + String(a.txt).slice(0, 6000);
    else if((a.ty || '').indexOf('image/') === 0) last += '\n\n[attached image: ' + a.n + ' — ' + window.fmtSz(a.sz) + ']';
    else if(a.vid) last += '\n\n[attached video: ' + a.n + ' — ' + window.fmtSz(a.sz) + ']';
    else last += '\n\n[attached file: ' + a.n + ' — ' + window.fmtSz(a.sz) + ']';
  });
  const ctx = brainContext(c);
  if(ctx.length) ctx[ctx.length - 1].content = last;   // attachments ride along as text notes
  chip.textContent = 'thinking…';
  const call = () => fetch(API_BASE + '/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: ctx })          // no model field — the hosted brain picks its one engine
  });
  let d = null, failed = null;
  for(let attempt = 0; attempt < 2; attempt++){        // one quiet auto-retry for connection drops
    failed = null;
    try{
      const res = await call();
      d = await res.json().catch(() => null);
      if(d && d.ok && (d.text || '').trim()) break;
      failed = new Error(d && d.error ? d.error : 'HTTP ' + res.status);
      break;                                           // server already retried upstream — surface it
    }catch(e){
      failed = e;
      if(attempt === 0){
        chip.textContent = 'busy · retrying…';
        await new Promise(r => setTimeout(r, 4000));
      }
    }
  }
  if(!failed){
    chip.textContent = 'online';                       // one brain — no model names shown
    NET.live = true; renderStatus();
    typeReply(c, splitFence((d.text || '').trim()), pen);
    return;
  }
  chip.textContent = 'offline';
  pen.remove();                                        // never a dead end — offer a visible retry
  const el = document.createElement('div'); el.className = 'msg a';
  const who = document.createElement('span'); who.className = 'who'; who.textContent = 'XR Code';
  const body = document.createElement('div'); body.className = 'bubble';
  body.textContent = 'The AI server is unreachable right now — check your connection and try again in a moment.';
  const ch = document.createElement('span'); ch.className = 'chip'; ch.textContent = 'offline';
  const re = document.createElement('button'); re.className = 'retry-btn'; re.type = 'button';
  re.innerHTML = '<svg class="ic small"><use href="#i-sync"/></svg>Try again';
  re.onclick = () => {
    const lm = c.messages[c.messages.length - 1];
    if(!lm || lm.r !== 'u' || lm.t !== text){ toast('Context moved on — send your message again'); el.remove(); return; }
    el.remove(); askBrain(c, text, atts);
  };
  const line = document.createElement('div'); line.className = 'retry-line'; line.append(re);
  el.append(who, body, ch, line);
  if(currentChat().id === c.id) box0.append(el);
  box0.scrollTop = box0.scrollHeight;
}

/* ---------- search old chats & code ---------- */
function runSearch(q){
  const list = $('#searchResults'); list.innerHTML = '';
  q = (q || '').trim().toLowerCase();
  if(!q){
    const d = document.createElement('div'); d.className = 'sr-empty';
    d.textContent = 'Type to search your old chats and code';
    list.append(d); return;
  }
  let hits = 0;
  outer:
  for(const c of S.chats){
    for(let mi = 0; mi < c.messages.length; mi++){
      const m = c.messages[mi];
      const hay = ((m.t || '') + '\n' + (m.code || '')).toLowerCase();
      if(hay.indexOf(q) < 0) continue;
      hits++;
      const inCode = (m.code || '').toLowerCase().includes(q) && !(m.t || '').toLowerCase().includes(q);
      const raw = (inCode ? '[code] ' + (m.code || '').replace(/\s+/g, ' ') : (m.t || '').replace(/\s+/g, ' '));
      const ridx = raw.toLowerCase().indexOf(q);
      const start = Math.max(0, ridx - 32), end = ridx + q.length + 40;
      const snip = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sr-item';
      const t = document.createElement('span'); t.className = 'st'; t.textContent = c.title;
      const x = document.createElement('span'); x.className = 'sx'; x.textContent = snip;
      b.append(t, x);
      b.onclick = () => {
        S.active = c.id; save();
        showView('chat');
        $('#chatSearchWrap').classList.remove('open');
        requestAnimationFrame(() => {
          const el = $$('#msgs .msg')[mi];
          if(el){
            el.scrollIntoView({ block: 'center' });
            el.classList.add('hit');
            setTimeout(() => el.classList.remove('hit'), 1800);
          }
        });
      };
      list.append(b);
      if(hits >= 40) break outer;
    }
  }
  if(!hits){
    const d = document.createElement('div'); d.className = 'sr-empty';
    d.textContent = 'No matches for "' + q + '"';
    list.append(d);
  }
}

/* ---------- wire up ---------- */
document.addEventListener('contextmenu', e => e.preventDefault());   // right click: no browser menu — native app feel
/* block casual "peek at source" shortcuts (deterrent — devtools can never be fully blocked) */
document.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  const dev = e.key === 'F12' || (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c'));
  const src = (e.ctrlKey || e.metaKey) && !e.shiftKey && (k === 'u' || k === 's');
  if (dev || src){ e.preventDefault(); e.stopPropagation(); toast('Source is protected 🔒'); }
}, true);

/* ---------- file attach (paperclip right of send) ---------- */
(function(){
  const MAX_FILES = 4, MAX_BYTES = 8 * 1024 * 1024;
  window.fmtSz = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  const TXT_RE = /\.(txt|md|markdown|json|js|mjs|ts|tsx|jsx|py|rb|go|rs|java|kt|c|h|cpp|cs|php|sh|bash|yml|yaml|toml|ini|cfg|csv|tsv|html|htm|css|scss|xml|sql|log|env)$/i;
  const VID_RE = /\.(mp4|webm|mov|m4v|avi|mkv|flv)$/i;   // videos the AI can watch
  const VID_BYTES = 16 * 1024 * 1024;
  let ATT = [];
  const forms = [$('#chatForm'), $('#homeForm')];
  const pick = document.createElement('input');
  pick.type = 'file'; pick.multiple = true; pick.hidden = true;
  forms[0].appendChild(pick);
  const rows = forms.map(f => {
    const r = document.createElement('div');
    r.className = 'attach-row';
    f.prepend(r);
    return r;
  });
  const readText = f => new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || '').slice(0, 24000));
    r.onerror = () => res('');
    r.readAsText(f.slice(0, 200000));
  });
  const readDataURL = f => new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => res('');
    r.readAsDataURL(f);
  });
  async function addFiles(list){
    for(const f of Array.from(list || [])){
      if(ATT.length >= MAX_FILES){ toast('Up to ' + MAX_FILES + ' files at once'); break; }
      const isVid = (f.type || '').indexOf('video/') === 0 || VID_RE.test(f.name);
      if(f.size > (isVid ? VID_BYTES : MAX_BYTES)){ toast(f.name + ' is too large (max ' + (isVid ? 16 : 8) + ' MB)'); continue; }
      const a = { n: f.name, sz: f.size, ty: f.type || '' };
      if((f.type || '').indexOf('image/') === 0){
        a.d = await readDataURL(f);
      }else if(isVid){
        a.vid = true;                                    // chip only — the brain reads the text note
      }else if((f.type || '').indexOf('text/') === 0 || (f.type || '').indexOf('json') > -1 || TXT_RE.test(f.name)){
        a.txt = await readText(f);
      }
      ATT.push(a);
      draw();
    }
  }
  function draw(){
    rows.forEach(row => {
      row.innerHTML = '';
      ATT.forEach((a, i) => {
        const chip = document.createElement('span'); chip.className = 'att-chip';
        if(a.vid){
          const ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          ic.setAttribute('class', 'ic small'); ic.innerHTML = '<use href="#i-play"/>';
          chip.append(ic);
        }else if(a.d){
          const im = document.createElement('img'); im.src = a.d; im.alt = a.n; chip.append(im);
        }else{
          const ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          ic.setAttribute('class', 'ic small'); ic.innerHTML = '<use href="#i-file"/>';
          chip.append(ic);
        }
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = a.n; nm.title = a.n;
        const sz = document.createElement('span'); sz.className = 'sz'; sz.textContent = window.fmtSz(a.sz);
        const rm = document.createElement('button'); rm.className = 'rm'; rm.type = 'button'; rm.title = 'Remove'; rm.textContent = '\u00d7';
        rm.onclick = () => { ATT.splice(i, 1); draw(); };
        chip.append(nm, sz, rm);
        row.append(chip);
      });
    });
  }
  window.__takeAtts = () => { const out = ATT.slice(); ATT = []; draw(); return out; };
  $('#fileBtn').onclick = () => pick.click();
  $('#homeFileBtn').onclick = () => pick.click();
  pick.onchange = () => { addFiles(pick.files); pick.value = ''; };
  const view = $('#view-chat');                    // drag & drop anywhere on the chat
  ['dragover', 'dragenter'].forEach(ev => view.addEventListener(ev, e => {
    e.preventDefault();
    if(e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') > -1) form.classList.add('drop');
  }));
  view.addEventListener('dragleave', e => {
    if(!e.relatedTarget || !view.contains(e.relatedTarget)) form.classList.remove('drop');
  });
  view.addEventListener('drop', e => {
    e.preventDefault();
    form.classList.remove('drop');
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
})();

(function(){
  const bar = document.querySelector('.sidebar'), rz = $('#resizer');

  let on = false;
  rz.addEventListener('pointerdown', e => { on = true; rz.classList.add('drag'); document.body.style.cursor = 'col-resize'; e.preventDefault(); });
  window.addEventListener('pointermove', e => {
    if(!on) return;
    const w = Math.max(210, Math.min(460, e.clientX));
    bar.style.width = w + 'px';
    S.sidebarW = w;
  });
  window.addEventListener('pointerup', () => {
    if(!on) return;
    on = false; rz.classList.remove('drag'); document.body.style.cursor = '';
    save();
  });
})();
